name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck packages
        run: pnpm --filter @ragab/themes typecheck && pnpm --filter @ragab/content-schema typecheck && pnpm --filter @ragab/ui typecheck && pnpm --filter @ragab/api typecheck

      - name: Build web (Astro → Cloudflare)
        run: pnpm --filter @ragab/web build

      - name: Build API worker (dry-run)
        run: pnpm --filter @ragab/api build
