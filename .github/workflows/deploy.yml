name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only deploy from main (workflow_dispatch allowed).
    # Token lives on this environment (created as a named env rather than a repo secret).
    environment: CLOUDFLARE_API_TOKEN

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is missing"
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID secret is missing (required — Pages cannot infer the account from this API token)"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          verify=$(curl -sS https://api.cloudflare.com/client/v4/user/tokens/verify \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          echo "$verify" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("token verify:", d.get("success"), d.get("errors") or d.get("result",{}).get("status"))'
          if ! echo "$verify" | python3 -c 'import json,sys; raise SystemExit(0 if json.load(sys.stdin).get("success") else 1)'; then
            echo "::error::CLOUDFLARE_API_TOKEN is invalid or expired. Create a new token (Edit Cloudflare Workers + Account Pages Edit) and set the secret."
            exit 1
          fi
          pages=$(curl -sS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/ragab-web" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          echo "$pages" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("pages project:", d.get("success"), (d.get("result") or {}).get("name") or d.get("errors"))'
          if ! echo "$pages" | python3 -c 'import json,sys; raise SystemExit(0 if json.load(sys.stdin).get("success") else 1)'; then
            echo "::error::Token cannot access Pages project ragab-web. Grant Account → Cloudflare Pages → Edit on this account."
            exit 1
          fi

      - name: Lint
        run: pnpm lint

      - name: Build web
        run: pnpm --filter @ragab/web build

      - name: Deploy web (Cloudflare Pages)
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler pages deploy dist --project-name=ragab-web --commit-dirty=true

      - name: Deploy API (Cloudflare Workers)
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
