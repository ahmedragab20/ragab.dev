<head>
  <meta charset="UTF-8" />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* rose-pine (default) */
      --bg: #191724;
      --panel: #1f1d2e;
      --fg: #e0def4;
      --dim: #6e6a86;
      --muted: #908caa;
      --bright: #c4a7e7;
      --accent: #ebbcba;
      --love: #eb6f92;
      --gold: #f6c177;
      --foam: #9ccfd8;
      --pine: #31748f;
      --border: #26233a;
      --cursor: #ebbcba;
      --err: #eb6f92;
      --ok: #9ccfd8;
      --scan: rgba(0, 0, 0, 0.06);
      --vignette: rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 14px;
      line-height: 1.55;
      overflow: hidden;
      transition: background 0.45s ease, color 0.35s ease;
    }

    /* subtle CRT / glass — stays quiet */
    body::before {
      content: "";
      pointer-events: none;
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at center, transparent 55%, var(--vignette) 100%),
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 3px,
          var(--scan) 3px,
          var(--scan) 4px
        );
      z-index: 40;
      opacity: 0.85;
      animation: grain 8s steps(6) infinite;
    }

    @keyframes grain {
      0%, 100% { opacity: 0.82; }
      50% { opacity: 0.9; }
    }

    .shell {
      height: 100%;
      display: flex;
      flex-direction: column;
      max-width: 900px;
      margin: 0 auto;
      padding: 1.35rem 1.2rem 0.9rem;
      position: relative;
      z-index: 1;
      animation: shellIn 0.55s ease both;
    }

    @keyframes shellIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }

    .titlebar {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      color: var(--dim);
      font-size: 12px;
      letter-spacing: 0.03em;
      margin-bottom: 0.9rem;
      user-select: none;
      flex-shrink: 0;
    }

    .dots { display: flex; gap: 6px; }
    .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--border);
      transition: background 0.35s ease;
    }
    .dot.r { background: var(--love); opacity: 0.9; }
    .dot.y { background: var(--gold); opacity: 0.9; }
    .dot.g { background: var(--ok); opacity: 0.85; }

    .titlebar .path { flex: 1; text-align: center; color: var(--dim); }
    .titlebar .path strong { color: var(--muted); font-weight: 500; }

    .badge {
      color: var(--bright);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      transition: color 0.35s, border-color 0.35s;
    }

    #output {
      flex: 1;
      overflow-y: auto;
      padding-right: 6px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    #output::-webkit-scrollbar { width: 6px; }
    #output::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    .line {
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 1px;
      animation: lineIn 0.22s ease both;
    }

    @keyframes lineIn {
      from { opacity: 0; transform: translateX(-3px); }
      to { opacity: 1; transform: none; }
    }

    .line.dim { color: var(--dim); }
    .line.muted { color: var(--muted); }
    .line.bright { color: var(--bright); }
    .line.accent { color: var(--accent); }
    .line.gold { color: var(--gold); }
    .line.foam { color: var(--foam); }
    .line.love { color: var(--love); }
    .line.ok { color: var(--ok); }
    .line.err { color: var(--err); }
    .line.indent { padding-left: 1.1em; }

    .line a {
      color: var(--foam);
      text-decoration: none;
      border-bottom: 1px dashed var(--dim);
      transition: border-color 0.15s, color 0.15s;
    }
    .line a:hover {
      color: var(--bright);
      border-bottom-style: solid;
    }

    .prompt-row {
      display: flex;
      align-items: flex-start;
      margin-top: 0.45rem;
      padding-top: 0.55rem;
      flex-shrink: 0;
      animation: promptIn 0.4s 0.15s ease both;
    }

    @keyframes promptIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .prompt {
      color: var(--bright);
      white-space: nowrap;
      user-select: none;
      transition: color 0.35s ease;
    }
    .prompt .user { color: var(--accent); }
    .prompt .at { color: var(--dim); }
    .prompt .host { color: var(--foam); }
    .prompt .sep { color: var(--dim); }
    .prompt .dir { color: var(--gold); }

    #cmd {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--fg);
      font: inherit;
      caret-color: transparent;
      padding: 0;
      min-width: 0;
      transition: color 0.35s ease;
    }

    .cursor {
      display: inline-block;
      width: 0.55em;
      height: 1.15em;
      background: var(--cursor);
      margin-left: 1px;
      vertical-align: text-bottom;
      animation: blink 1.05s step-end infinite;
      transition: background 0.35s ease;
      border-radius: 1px;
      opacity: 0.9;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0; }
    }

    .hint {
      margin-top: 0.65rem;
      color: var(--dim);
      font-size: 11.5px;
      user-select: none;
      flex-shrink: 0;
      opacity: 0;
      animation: hintIn 0.5s 0.6s ease forwards;
    }

    @keyframes hintIn {
      to { opacity: 1; }
    }

    .hint kbd {
      border: 1px solid var(--border);
      padding: 1px 5px;
      border-radius: 3px;
      color: var(--muted);
      font-size: 10.5px;
    }

    /* theme flash — subtle wash on switch */
    .theme-flash {
      pointer-events: none;
      position: fixed;
      inset: 0;
      background: var(--bright);
      opacity: 0;
      z-index: 60;
      transition: opacity 0.05s;
    }
    .theme-flash.on {
      opacity: 0.06;
      transition: none;
    }

    @media (max-width: 600px) {
      html, body { font-size: 13px; }
      .shell { padding: 1rem 0.8rem 0.75rem; }
      .hint { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before { animation: none !important; transition: none !important; }
      body::before { animation: none; }
      .line { animation: none; }
      .shell, .prompt-row, .hint { opacity: 1; transform: none; }
    }
  </style>
</head>

    const output = document.getElementById("output");

    function applyTheme(name, { silent = false } = {}) {
      const key = resolveTheme(name);
      if (!key) return false;
      const t = THEMES[key];
      const root = document.documentElement;
      for (const [k, v] of Object.entries(t)) {
        root.style.setProperty("--" + k, v);
      }
      themeBadge.textContent = key;
      localStorage.setItem(THEME_STORAGE, key);

      if (!silent) {
        flash.classList.add("on");
        requestAnimationFrame(() => {
          setTimeout(() => flash.classList.remove("on"), 80);
        });
      }
      return key;
    }

    function resolveTheme(name) {
      if (!name) return null;
      const q = name.toLowerCase().trim().replace(/\s+/g, "-");
      if (THEMES[q]) return q;
      // fuzzy: startsWith or includes
      const start = THEME_NAMES.find((n) => n.startsWith(q));
      if (start) return start;
      const inc = THEME_NAMES.find((n) => n.includes(q));
      return inc || null;
    }

    function print(lines, { animate = true } = {}) {
      if (!lines) return Promise.resolve();
      if (!animate || window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        for (const item of lines) appendLine(item);
        scroll();
        return Promise.resolve();
      }
      printing = true;
      return (async () => {
        for (const item of lines) {
          appendLine(item);
          scroll();
          await sleep(item.t === "" ? 12 : 18 + Math.random() * 22);
        }
        printing = false;
      })();
    }

    function appendLine(item) {
      const div = document.createElement("div");
      const cls = ["line"];
      if (item.c) cls.push(item.c);
      if (item.indent) cls.push("indent");
      div.className = cls.join(" ");
      if (item.html) {
        div.innerHTML = item.html;
      } else {
        div.textContent = item.t ?? "";
      }
      output.appendChild(div);
    }

    function sleep(ms) {
      return new Promise((r) => setTimeout(r, ms));
    }

    function scroll() {
      output.scrollTop = output.scrollHeight;
    }

    function echoPrompt(cmd) {
      appendLine({
        html: `<span style="color:var(--accent)">guest</span><span style="color:var(--dim)">@</span><span style="color:var(--foam)">ragab.dev</span><span style="color:var(--dim)">:</span><span style="color:var(--gold)">~</span><span style="color:var(--dim)">$ </span>${esc(cmd)}`,
        c: "dim",
      });
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
      );
    }

    /* ── commands ── */
    const commands = {
      help: () => [
        { t: "ragab.dev — classic terminal", c: "bright" },
        { t: "" },
        { t: "identity", c: "gold" },
        { t: "  whoami          about me" },
        { t: "  status          availability + time" },
        { t: "  bio             short bio" },
        { t: "  stack           tech I use" },
        { t: "  projects        selected work" },
        { t: "" },
        { t: "content", c: "gold" },
        { t: "  blogs           list blog posts" },
        { t: "  blog <slug>     read a post" },
        { t: "  announcements   site announcements" },
        { t: "  announce        alias of announcements" },
        { t: "  contact         how to reach me" },
        { t: "" },
        { t: "theme", c: "gold" },
        { t: "  theme           show current theme" },
        { t: "  theme list      list all themes (" + THEME_NAMES.length + ")" },
        { t: "  theme <name>    switch theme" },
        { t: "  theme random    pick a random theme" },
        { t: "  theme reset     back to rose-pine" },
        { t: "" },
        { t: "shell", c: "gold" },
        { t: "  clear · ls · neofetch · help" },
        { t: "" },
        { t: "tip: tab-complete works on commands & theme names", c: "dim" },
      ],

      whoami: () => [
        { t: PROFILE.name, c: "bright" },
        { t: PROFILE.role + " · " + PROFILE.location, c: "muted" },
        { t: "" },
        ...PROFILE.bio.map((l) => ({ t: l })),
      ],

      status: () => {
        const time = new Date().toLocaleTimeString("en-GB", {
          hour: "2-digit", minute: "2-digit", timeZone: "Africa/Cairo",
        });
        return [
          { t: "● " + PROFILE.status + "  /  " + time + " in Cairo", c: "ok" },
          { t: "open to interesting work · remote-friendly", c: "dim" },
        ];
      },

      bio: () => PROFILE.bio.map((l) => ({ t: l })),

      stack: () => PROFILE.stack.map((l) => ({ t: l, c: "muted" })),

      projects: () => [
        { t: "→ ragab.dev", c: "bright" },
        { t: "  this shell — terminal-first personal space", c: "dim" },
        { t: "" },
        { t: "→ project-alpha", c: "bright" },
        { t: "  realtime collaboration layer", c: "dim" },
        { t: "" },
        { t: "→ project-beta", c: "bright" },
        { t: "  infrastructure tooling for small teams", c: "dim" },
        { t: "" },
        { t: "more in blogs · type contact to say hi", c: "dim" },
      ],

      blogs: () => {
        const lines = [
          { t: "blog  (" + CONTENT.blogs.length + " posts)", c: "bright" },
          { t: "" },
        ];
        for (const p of CONTENT.blogs) {
          lines.push({ t: p.date + "  " + p.slug, c: "foam" });
          lines.push({ t: p.title, c: "accent" });
          lines.push({ t: p.excerpt, c: "dim" });
          lines.push({ t: "tags: " + p.tags.join(", "), c: "dim" });
          lines.push({ t: "" });
        }
        lines.push({ t: "read with:  blog <slug>", c: "muted" });
        return lines;
      },

      blog: (args) => {
        const slug = (args[0] || "").toLowerCase();
        if (!slug) {
          return [
            { t: "usage: blog <slug>", c: "gold" },
            { t: "try: blog agent-native-sites", c: "dim" },
            { t: "or:  blogs   to list all", c: "dim" },
          ];
        }
        const post = CONTENT.blogs.find(
          (p) => p.slug === slug || p.slug.startsWith(slug) || p.slug.includes(slug)
        );
        if (!post) {
          return [
            { t: "post not found: " + slug, c: "err" },
            { t: "type blogs to list slugs", c: "dim" },
          ];
        }
        return [
          { t: post.title, c: "bright" },
          { t: post.date + "  ·  " + post.tags.join(" · "), c: "dim" },
          { t: "─".repeat(40), c: "dim" },
          { t: "" },
          ...post.body.map((l) => ({ t: l || " " })),
          { t: "" },
          { t: "─".repeat(40), c: "dim" },
          { t: "slug: " + post.slug, c: "muted" },
        ];
      },

      announcements: () => {
        const lines = [
          { t: "announcements", c: "bright" },
          { t: "" },
        ];
        const sorted = [...CONTENT.announcements].sort((a, b) =>
          a.pinned === b.pinned ? b.date.localeCompare(a.date) : a.pinned ? -1 : 1
        );
        for (const a of sorted) {
          const pin = a.pinned ? " ✦" : "";
          lines.push({ t: (a.pinned ? "● " : "○ ") + a.title + pin, c: a.pinned ? "gold" : "accent" });
          lines.push({ t: a.date + "  ·  " + a.slug, c: "dim" });
          for (const line of a.body) lines.push({ t: line, c: "muted" });
          lines.push({ t: "" });
        }
        return lines;
      },

      announce: (args) => commands.announcements(args),
      news: (args) => commands.announcements(args),

      contact: () => [
        { t: "contact", c: "bright" },
        { t: "" },
        { t: "email     " + PROFILE.contact.email },
        { t: "github    " + PROFILE.contact.github },
        { t: "twitter   " + PROFILE.contact.twitter },
        { t: "linkedin  " + PROFILE.contact.linkedin },
        { t: "" },
        { t: "prefer email for anything real.", c: "dim" },
      ],

      theme: (args) => {
        const sub = (args[0] || "").toLowerCase();
        const rest = args.slice(1).join("-") || args.slice(1).join(" ");

        if (!sub) {
          const cur = themeBadge.textContent;
          return [
            { t: "theme  " + cur, c: "bright" },
            { t: THEME_NAMES.length + " themes available", c: "dim" },
            { t: "theme list · theme <name> · theme random · theme reset", c: "muted" },
          ];
        }

        if (sub === "list" || sub === "ls") {
          const lines = [
            { t: "themes  (" + THEME_NAMES.length + ")", c: "bright" },
            { t: "" },
          ];
          const cols = 3;
          const names = THEME_NAMES.map((n) =>
            n === themeBadge.textContent ? n + "*" : n
          );
          for (let i = 0; i < names.length; i += cols) {
            const row = names.slice(i, i + cols).map((n) => n.padEnd(22)).join("");
            lines.push({ t: "  " + row.trimEnd(), c: "muted" });
          }
          lines.push({ t: "" });
          lines.push({ t: "* current · theme <name> to switch", c: "dim" });
          return lines;
        }

        if (sub === "random" || sub === "rand") {
          const cur = themeBadge.textContent;
          let pick = cur;
          while (pick === cur && THEME_NAMES.length > 1) {
            pick = THEME_NAMES[Math.floor(Math.random() * THEME_NAMES.length)];
          }
          applyTheme(pick);
          return [
            { t: "theme → " + pick, c: "ok" },
          ];
        }

        if (sub === "reset" || sub === "default") {
          applyTheme("rose-pine");
          return [{ t: "theme → rose-pine", c: "ok" }];
        }

        // theme <name>  (sub may be first token of multi-word)
        const name = [sub, rest].filter(Boolean).join("-").replace(/-+/g, "-");
        const applied = applyTheme(name);
        if (!applied) {
          const near = THEME_NAMES.filter((n) => n.includes(sub)).slice(0, 5);
          return [
            { t: "unknown theme: " + name, c: "err" },
            ...(near.length
              ? [{ t: "did you mean: " + near.join(", "), c: "dim" }]
              : [{ t: "type theme list", c: "dim" }]),
          ];
        }
        return [{ t: "theme → " + applied, c: "ok" }];
      },

      ls: () => [
        { t: "drwxr-xr-x  whoami" },
        { t: "drwxr-xr-x  status" },
        { t: "drwxr-xr-x  bio" },
        { t: "drwxr-xr-x  stack" },
        { t: "drwxr-xr-x  projects" },
        { t: "drwxr-xr-x  blogs" },
        { t: "drwxr-xr-x  announcements" },
        { t: "drwxr-xr-x  contact" },
        { t: "drwxr-xr-x  theme" },
        { t: "-rw-r--r--  README" },
      ],

      neofetch: () => [
        { t: "       .--.        " + PROFILE.name.toLowerCase().replace(/\s+/g, "") + "@ragab.dev", c: "bright" },
        { t: "      |o_o |       ---------------" },
        { t: "      |:_/ |       OS:     human / " + PROFILE.location.toLowerCase() },
        { t: "     //   \\ \\      Host:   ragab.dev" },
        { t: "    (|     | )     Kernel: curiosity 0.9" },
        { t: "   /'\\_   _/`\\     Shell:  classic-terminal" },
        { t: "   \\___)=(___/     Theme:  " + themeBadge.textContent },
        { t: "                   Blogs:  " + CONTENT.blogs.length },
        { t: "                   News:   " + CONTENT.announcements.length },
      ],

      clear: () => {
        output.innerHTML = "";
        return null;
      },

      about: () => commands.whoami(),
      me: () => commands.whoami(),
      tech: () => commands.stack(),
      skills: () => commands.stack(),
      work: () => commands.projects(),
      posts: () => commands.blogs(),
      post: (args) => commands.blog(args),
      read: (args) => commands.blog(args),
    };

    const cmdNames = Object.keys(commands);

    async function run(raw) {
      const line = raw.trim();
      if (!line) return;

      history.push(line);
      histIdx = -1;
      draft = "";

      echoPrompt(line);
      scroll();

      const parts = line.split(/\s+/);
      const key = parts[0].toLowerCase();
      const args = parts.slice(1);

      if (commands[key]) {
        const result = commands[key](args);
        if (result) {
          await print(result);
          await print([{ t: "" }]);
        }
      } else {
        await print([
          { t: "command not found: " + key, c: "err" },
          { t: "type 'help' for available commands.", c: "dim" },
          { t: "" },
        ]);
      }
    }

    /* ── input ── */
    input.addEventListener("keydown", async (e) => {
      if (printing && e.key === "Enter") {
        e.preventDefault();
        return;
      }

      if (e.key === "Enter") {
        const v = input.value;
        input.value = "";
        e.preventDefault();
        await run(v);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        if (!history.length) return;
        if (histIdx === -1) draft = input.value;
        histIdx = Math.min(histIdx + 1, history.length - 1);
        input.value = history[history.length - 1 - histIdx];
        moveCaret();
      } else if (e.key === "ArrowDown") {
        e.preventDefault();
        if (histIdx <= 0) {
          histIdx = -1;
          input.value = draft;
        } else {
          histIdx--;
          input.value = history[history.length - 1 - histIdx];
        }
        moveCaret();
      } else if (e.key === "Tab") {
        e.preventDefault();
        tabComplete();
      } else if (e.key === "l" && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        output.innerHTML = "";
      } else if (e.key === "c" && (e.ctrlKey || e.metaKey)) {
        // allow copy; if empty input, show ^C feel
        if (!input.value && window.getSelection()?.toString() === "") {
          e.preventDefault();
          appendLine({ t: "^C", c: "dim" });
          scroll();
        }
      }
    });

    function tabComplete() {
      const val = input.value;
      const parts = val.split(/\s+/);
      if (parts.length <= 1) {
        const partial = (parts[0] || "").toLowerCase();
        if (!partial) return;
        const match = cmdNames.find((n) => n.startsWith(partial));
        if (match) {
          input.value = match + (match === "blog" || match === "theme" ? " " : "");
          moveCaret();
        }
        return;
      }

      const cmd = parts[0].toLowerCase();
      const partial = parts[parts.length - 1].toLowerCase();

      if (cmd === "theme") {
        if (["list", "random", "reset", "ls", "rand", "default"].some((s) => s.startsWith(partial)) && partial) {
          const sub = ["list", "random", "reset"].find((s) => s.startsWith(partial));
          if (sub) {
            input.value = "theme " + sub;
            moveCaret();
            return;
          }
        }
        const match = THEME_NAMES.find((n) => n.startsWith(partial) || n.includes(partial));
        if (match) {
          input.value = "theme " + match;
          moveCaret();
        }
      }

      if (cmd === "blog" || cmd === "post" || cmd === "read") {
        const match = CONTENT.blogs.find(
          (p) => p.slug.startsWith(partial) || p.slug.includes(partial)
        );
        if (match) {
          input.value = cmd + " " + match.slug;
          moveCaret();
        }
      }
    }

    function moveCaret() {
      requestAnimationFrame(() => {
        input.selectionStart = input.selectionEnd = input.value.length;
      });
    }

    document.addEventListener("click", () => input.focus());
    input.addEventListener("blur", () => setTimeout(() => input.focus(), 20));

    /* ── boot ── */
    async function boot() {
      const saved = localStorage.getItem(THEME_STORAGE) || "rose-pine";
      applyTheme(THEMES[saved] ? saved : "rose-pine", { silent: true });

      await print([
        { t: "ragab.dev — classic terminal", c: "bright" },
        { t: "theme: " + themeBadge.textContent + "  ·  " + THEME_NAMES.length + " palettes", c: "dim" },
        { t: "" },
        { t: "type help · blogs · announcements · contact · theme list", c: "muted" },
        { t: "" },
      ], { animate: true });

      input.focus();
    }

    boot();
  </script>
</body>
